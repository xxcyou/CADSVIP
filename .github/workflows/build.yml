name: build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: install build tools
        run: |
          sdkmanager --install "build-tools;34.0.0" "platforms;android-34" >/dev/null 2>&1 || true
          ls "$ANDROID_HOME/build-tools/34.0.0/" | head -20
      - name: build stub jar
        run: |
          mkdir -p /tmp/stub
          javac -nowarn -d /tmp/stub libs/XposedBridgeApi-stub.java libs/callbacks/XC_LoadHook.java
          jar cf libs/XposedBridgeApi-stub.jar -C /tmp/stub .
      - name: compile hook sources
        run: |
          mkdir -p out/classes out/dex
          find app/src/main/java -name '*.java' > /tmp/srcs.txt
          javac -nowarn -source 1.8 -target 1.8 -cp libs/XposedBridgeApi-stub.jar -d out/classes @/tmp/srcs.txt
          echo "compiled classes: $(find out/classes -name '*.class' | wc -l)"
      - name: dex with d8
        run: |
          D8="$ANDROID_HOME/build-tools/34.0.0/d8"
          "$D8" --release --lib "$ANDROID_HOME/platforms/android-34/android.jar" --output out/dex $(find out/classes -name '*.class')
          mv out/dex/classes.dex out/classes.dex
          ls -la out/classes.dex
      - name: package & sign apk
        run: |
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          ZA="$ANDROID_HOME/build-tools/34.0.0/zipalign"
          AS="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          mkdir -p app/res
          "$AAPT" package -f -M app/src/main/AndroidManifest.xml -S app/res -A app/src/main/assets -I "$ANDROID_HOME/platforms/android-34/android.jar" -F /tmp/unsigned.apk
          cd out && "$AAPT" add /tmp/unsigned.apk classes.dex && cd ..
          "$ZA" -f 4 /tmp/unsigned.apk /tmp/aligned.apk
          keytool -genkeypair -alias k -keystore /tmp/ks.jks -storepass 123456 -keypass 123456 -dname "CN=cad" -keyalg RSA -validity 10000 -storetype JKS
          "$AS" sign --ks /tmp/ks.jks --ks-pass pass:123456 --key-pass pass:123456 --out /tmp/CADSVIP.apk /tmp/aligned.apk
          mkdir -p artifact
          cp /tmp/CADSVIP.apk artifact/CADSVIP.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CADSVIP
          path: artifact/*.apk
